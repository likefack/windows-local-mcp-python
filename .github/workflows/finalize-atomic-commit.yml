name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and dev checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Ruff
        run: python -m ruff check .

  compile:
    name: Compile all
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile all
        run: python -m compileall -q src tests

  whitespace:
    name: Diff whitespace
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Diff whitespace check
        shell: bash
        run: git diff --check HEAD^ HEAD

  stdio-python313:
    name: MCP stdio / Python 3.13 wheel
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install wheel-shaped production package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pytest>=8,<9"
          python -m pip check
          python --version
          python -I -B -c "import windows_local_mcp; print(windows_local_mcp.__file__)"

      - name: Real Windows stdio negotiation
        run: python -m pytest -q tests/test_mcp_stdio_transport.py

  tests:
    name: Pytest
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Focused process identity security regression
        run: >-
          python -m pytest -q
          tests/test_process_identity_termination.py
          tests/test_resources_and_processes.py

      - name: Focused race, recovery, and transaction tests
        run: >-
          python -m pytest -q
          tests/test_windows_transaction.py
          tests/test_server_operations.py
          tests/test_timeline_and_rollback.py

      - name: Focused Automatic Git Broker regression
        run: >-
          python -m pytest -q
          tests/test_git_environment.py
          tests/test_git_semantics.py
          tests/test_git_broker_launch_gate.py
          tests/test_git_broker_live_verify.py
          tests/test_git_broker_projection_boundary.py
          tests/test_git_ref_projection.py
          tests/test_git_broker_resource_limits.py
          tests/test_git_object_access.py
          tests/test_git_worker_routing.py
          tests/test_security_regressions_git_staging.py
          tests/test_tool_safety.py
          tests/test_directory_toctou.py
          tests/test_mcp_stdio_transport.py
          tests/test_sandbox_scratch_retention.py

      - name: Full pytest
        run: python -m pytest
