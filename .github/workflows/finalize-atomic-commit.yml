name: Verify atomic workspace commit

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.title == '[WLMCP] atomic commit verification'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture checked out SHA
        id: checkout_sha
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev checks
        id: install
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --upgrade pip 2>&1 | Tee-Object -FilePath install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev]" 2>&1 | Tee-Object -FilePath install.log -Append
          exit $LASTEXITCODE

      - name: Focused race, recovery, and transaction tests
        id: focused
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pytest -q tests/test_windows_transaction.py tests/test_server_operations.py tests/test_timeline_and_rollback.py 2>&1 | Tee-Object -FilePath focused.log
          exit $LASTEXITCODE

      - name: Full pytest
        id: full_pytest
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pytest 2>&1 | Tee-Object -FilePath full-pytest.log
          exit $LASTEXITCODE

      - name: Ruff
        id: ruff
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m ruff check . 2>&1 | Tee-Object -FilePath ruff.log
          exit $LASTEXITCODE

      - name: Compile all
        id: compileall
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m compileall -q src tests 2>&1 | Tee-Object -FilePath compileall.log
          exit $LASTEXITCODE

      - name: Diff whitespace check
        id: diff_check
        continue-on-error: true
        shell: bash
        run: git diff --check 2>&1 | tee diff-check.log

      - name: Report issue-triggered verification
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = {
              install: '${{ steps.install.outcome }}',
              focused_race_recovery_transaction: '${{ steps.focused.outcome }}',
              full_pytest: '${{ steps.full_pytest.outcome }}',
              ruff: '${{ steps.ruff.outcome }}',
              compileall: '${{ steps.compileall.outcome }}',
              diff_check: '${{ steps.diff_check.outcome }}',
            };
            const passed = Object.values(results).every((value) => value === 'success');
            const rows = Object.entries(results)
              .map(([name, outcome]) => `| ${name} | ${outcome} |`)
              .join('\n');
            const parts = [
              `Atomic workspace commit verification for checked-out \`${{ steps.checkout_sha.outputs.sha }}\``,
              '',
              '| check | outcome |',
              '| --- | --- |',
              rows,
              '',
              `Overall: **${passed ? 'PASS' : 'FAIL'}**`,
            ];
            const logs = {
              install: 'install.log',
              focused_race_recovery_transaction: 'focused.log',
              full_pytest: 'full-pytest.log',
              ruff: 'ruff.log',
              compileall: 'compileall.log',
              diff_check: 'diff-check.log',
            };
            for (const [name, outcome] of Object.entries(results)) {
              const path = logs[name];
              if (outcome === 'success' || !path || !fs.existsSync(path)) continue;
              const text = fs.readFileSync(path, 'utf8');
              parts.push('', `### ${name} log tail`, '', '```text', text.slice(-12000), '```');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: parts.join('\n'),
            });

      - name: Fail workflow if any verification failed
        if: always()
        shell: pwsh
        run: |
          $outcomes = @(
            '${{ steps.install.outcome }}',
            '${{ steps.focused.outcome }}',
            '${{ steps.full_pytest.outcome }}',
            '${{ steps.ruff.outcome }}',
            '${{ steps.compileall.outcome }}',
            '${{ steps.diff_check.outcome }}'
          )
          if ($outcomes | Where-Object { $_ -ne 'success' }) {
            Write-Error "One or more verification steps did not succeed: $($outcomes -join ', ')"
            exit 1
          }
