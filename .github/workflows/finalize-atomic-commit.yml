name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and dev checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Ruff
        run: python -m ruff check .

  compile:
    name: Compile all
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile all
        run: python -m compileall -q src tests

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'install-approved-host-runtime.ps1',
            'install-approved-host-authority.ps1',
            'recover-approved-host-authority.ps1',
            'verify-approved-host-runtime.ps1',
            'verify-approved-host-authority.ps1',
            'verify-approved-host-authority-abnormal.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
          }

  whitespace:
    name: Diff whitespace
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Diff whitespace check
        shell: bash
        run: git diff --check HEAD^ HEAD

  tests:
    name: Pytest
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Focused process identity security regression
        run: >-
          python -m pytest -q
          tests/test_process_identity_termination.py
          tests/test_resources_and_processes.py

      - name: Focused race, recovery, and transaction tests
        run: >-
          python -m pytest -q
          tests/test_windows_transaction.py
          tests/test_server_operations.py
          tests/test_timeline_and_rollback.py

      - name: Focused WLMCP-R2-001 authority regressions
        run: >-
          python -m pytest -q
          tests/test_approved_host_authority_state.py
          tests/test_approved_host_hardened_state.py
          tests/test_approved_host_fail_closed.py
          tests/test_approved_host_policy.py
          tests/test_approved_host_process_census.py
          tests/test_approved_host_stop_boundary.py
          tests/test_approved_host_service_entry.py
          tests/test_approved_host_crash_recovery.py
          tests/test_approved_host_audit_integrity.py
          tests/test_approval_execution_integration.py
          tests/test_runtime_immutability.py::test_executor_blocks_approved_host_before_worker_spawn

      - name: Full pytest
        run: python -m pytest
