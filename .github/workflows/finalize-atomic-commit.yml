name: Finalize atomic workspace commit

on:
  push:
    branches: [main]
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'push' || github.event.issue.title == 'wlmcp-atomic-finalize'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic atomic-commit patch
        run: python tools/_finalize_atomic_commit.py

      - name: Install package and dev checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Focused workspace race and recovery tests
        run: python -m pytest -q tests/test_workspace_transaction_commit.py tests/test_server_operations.py tests/test_timeline_and_rollback.py

      - name: Full pytest
        run: python -m pytest

      - name: Ruff
        run: python -m ruff check .

      - name: Compile all
        run: python -m compileall -q src tests

      - name: Diff whitespace check
        shell: bash
        run: git diff --check

      - name: Commit verified final state
        shell: bash
        run: |
          git rm tools/_finalize_atomic_commit.py
          git rm .github/workflows/finalize-atomic-commit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: workspace commit競合を原子的に遮断"
          git push origin HEAD:main
