name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and dev checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Ruff
        run: python -m ruff check .

  compile:
    name: Compile all
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile all
        run: python -m compileall -q src tests

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'install-approved-host-runtime.ps1',
            'install-approved-host-authority.ps1',
            'recover-approved-host-authority.ps1',
            'verify-approved-host-runtime.ps1',
            'verify-approved-host-authority.ps1',
            'verify-approved-host-authority-abnormal.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
          }

  whitespace:
    name: Diff whitespace
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Diff whitespace check
        shell: bash
        run: git diff --check HEAD^ HEAD

  stdio-python313:
    name: MCP stdio / Python 3.13 wheel
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install wheel-shaped production package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pytest>=8,<9"
          python -m pip check
          python --version
          python -I -B -c "import windows_local_mcp; print(windows_local_mcp.__file__)"

      - name: Real Windows stdio negotiation
        run: python -m pytest -q tests/test_mcp_stdio_transport.py

  tests:
    name: Pytest core
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Verify pytest shard completeness
        run: python tests/ci_shards.py

      - name: Core pytest
        run: python -m pytest --ignore=tests/test_runtime_closure_integration.py

  runtime-closure:
    name: Runtime closure
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Runtime closure pytest
        run: python -m pytest -q tests/test_runtime_closure_integration.py
