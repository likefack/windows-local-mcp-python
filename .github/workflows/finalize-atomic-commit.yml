name: Verify atomic workspace commit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Focused race, recovery, and transaction tests
        run: >-
          python -m pytest -q
          tests/test_windows_transaction.py
          tests/test_server_operations.py
          tests/test_timeline_and_rollback.py

      - name: Full pytest
        run: python -m pytest

      - name: Ruff
        run: python -m ruff check .

      - name: Compile all
        run: python -m compileall -q src tests

      - name: Diff whitespace check
        shell: bash
        run: git diff --check
