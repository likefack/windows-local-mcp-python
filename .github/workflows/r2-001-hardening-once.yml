name: R2-001 Hardening Once

on:
  push:
    branches:
      - fix/wlmcp-r2-001-root

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message != 'Apply WLMCP-R2-001 hardening patch'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/wlmcp-r2-001-root
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dev checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Apply exact hardening patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != count:
                  raise SystemExit(f"{path}: expected {count} exact matches, got {text.count(old)}")
              target.write_text(text.replace(old, new, count), encoding="utf-8", newline="\n")

          replace(
              "src/windows_local_mcp/approved_host_policy.py",
              "    except Exception as error:  # noqa: BLE001 - normalize authority failures at API boundary\n",
              "    except Exception as error:\n",
          )
          replace(
              "install-approved-host-authority.ps1",
              '& $RuntimePython -I -B -c "import windows_local_mcp.approved_host_service_entry" \n',
              '& $RuntimePython -I -B -c "import windows_local_mcp.approved_host_service_entry"\n',
          )
          replace(
              "src/windows_local_mcp/windows_user_process.py",
              """        attribute_buffer = ctypes.create_string_buffer(attribute_size.value)\n        attribute_list = ctypes.cast(attribute_buffer, ctypes.c_void_p)\n        if not _kernel32.InitializeProcThreadAttributeList(\n            attribute_list,\n            1,\n            0,\n            ctypes.byref(attribute_size),\n        ):\n            raise _winerror(\"InitializeProcThreadAttributeList\")\n""",
              """        attribute_buffer = ctypes.create_string_buffer(attribute_size.value)\n        attribute_candidate = ctypes.cast(attribute_buffer, ctypes.c_void_p)\n        if not _kernel32.InitializeProcThreadAttributeList(\n            attribute_candidate,\n            1,\n            0,\n            ctypes.byref(attribute_size),\n        ):\n            raise _winerror(\"InitializeProcThreadAttributeList\")\n        attribute_list = attribute_candidate\n""",
          )
          replace(
              "src/windows_local_mcp/approved_host_service.py",
              "    _PROCESS_TERMINATE = 0x0001\n",
              "",
          )
          replace(
              "src/windows_local_mcp/approved_host_service.py",
              """        if action == \"launch\":\n            return self._launch(client_pid, request)\n        if action == \"cancel\":\n            return self._cancel(request)\n        raise ValueError(\"unknown Approved Host authority action\")\n""",
              """        if action == \"launch\":\n            return self._launch(client_pid, request)\n        raise ValueError(\"unknown Approved Host authority action\")\n""",
          )

          service_path = Path("src/windows_local_mcp/approved_host_service.py")
          service_text = service_path.read_text(encoding="utf-8")
          pattern = r"\n    def _cancel\(.*?\n\nclass _WindowsServiceHost:"
          service_text, matched = re.subn(
              pattern,
              "\n\nclass _WindowsServiceHost:",
              service_text,
              count=1,
              flags=re.DOTALL,
          )
          if matched != 1:
              raise SystemExit(f"approved_host_service.py: expected one _cancel block, got {matched}")
          service_path.write_text(service_text, encoding="utf-8", newline="\n")

          test_path = Path("tests/test_server_operations.py")
          test_text = test_path.read_text(encoding="utf-8")
          pattern = r"def test_approved_host_runtime_preflight_is_not_promoted_to_capability_live_verification\(.*?\n\ndef test_backup_and_diff_limits_fail_before_replacement\("
          replacement = '''def test_approved_host_runtime_preflight_is_not_promoted_to_capability_live_verification(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    server, _ = load_server(tmp_path, monkeypatch)\n    server.runtime.settings.approved_host_enabled = True\n    monkeypatch.setattr(\n        server,\n        "assert_approved_host_runtime_immutable",\n        lambda: {\n            "version": 1,\n            "scope": "complete-runtime",\n            "path_count": 12,\n            "file_count": 5,\n            "directory_count": 4,\n            "ancestor_directory_count": 3,\n            "digest": "a" * 64,\n        },\n    )\n    monkeypatch.setattr(\n        server,\n        "assert_approved_host_authority_available",\n        lambda: {\n            "healthy": True,\n            "service_epoch": "test-epoch",\n            "active_operation_id": None,\n        },\n    )\n\n    status = server._approved_host_capability()\n\n    assert status["enabled"] is True\n    assert status["available"] is True\n    assert status["execution_route_available"] is True\n    assert status["unit_tested"] is True\n    assert status["live_verified"] is False\n    assert status["windows_live_verified"] is False\n    assert status["verification_scope"] == "runtime_and_authority_preflight_only"\n    assert status["runtime_preflight"]["status"] == "passed"\n    assert status["runtime_preflight"]["digest"] == "a" * 64\n    assert status["authority_preflight"] == {\n        "status": "passed",\n        "healthy": True,\n        "service_epoch": "test-epoch",\n        "active_operation_id": None,\n    }\n    runtime_property = status["properties"]["runtime_immutability"]\n    assert runtime_property["status"] == (\n        "verified" if os.name == "nt" else "unverified"\n    )\n    assert runtime_property["unit_tested"] is True\n    assert runtime_property["verification_kind"] == (\n        "windows_live_preflight" if os.name == "nt" else "non_windows_preflight"\n    )\n    authority_property = status["properties"]["authority_service_boundary"]\n    assert authority_property["status"] == (\n        "verified" if os.name == "nt" else "unverified"\n    )\n    assert authority_property["unit_tested"] is True\n    for property_name in (\n        "durable_recovery_state",\n        "requester_token_child",\n        "monitor_access_denial",\n        "control_plane_tamper_detection",\n        "approval_integrity",\n        "job_descendant_handling",\n        "outside_job_same_user_process_detection",\n        "timeout_termination",\n    ):\n        assert status["properties"][property_name] == {\n            "status": "unverified",\n            "unit_tested": True,\n        }\n    assert status["execution_time_recheck"] is True\n\n\ndef test_backup_and_diff_limits_fail_before_replacement('''
          test_text, matched = re.subn(
              pattern,
              lambda _match: replacement,
              test_text,
              count=1,
              flags=re.DOTALL,
          )
          if matched != 1:
              raise SystemExit(f"test_server_operations.py: expected one capability test, got {matched}")
          test_path.write_text(test_text, encoding="utf-8", newline="\n")
          '@ | Set-Content -LiteralPath .dev-r2-hardening.py -Encoding utf8
          python .dev-r2-hardening.py
          Remove-Item -LiteralPath .dev-r2-hardening.py -Force

      - name: Verify Ruff
        run: python -m ruff check src tests

      - name: Verify whitespace
        shell: bash
        run: git diff --check

      - name: Focused regression
        run: >-
          python -m pytest -q
          tests/test_server_operations.py
          tests/test_approved_host_policy.py
          tests/test_approved_host_service_entry.py
          tests/test_approved_host_stop_boundary.py

      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Hardening patch produced no changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests install-approved-host-authority.ps1
          git commit -m 'Apply WLMCP-R2-001 hardening patch'
          git push origin HEAD:fix/wlmcp-r2-001-root
