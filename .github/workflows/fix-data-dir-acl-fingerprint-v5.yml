name: Fix data_dir ACL fingerprint v5

on:
  push:
    branches: [fix/data-dir-acl-fingerprint]
    paths: [.github/workflows/fix-data-dir-acl-fingerprint-v5.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/data-dir-acl-fingerprint

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Patch source and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          config_path = Path('src/windows_local_mcp/config.py')
          config = config_path.read_text(encoding='utf-8')
          old = '''    logical_texts = {raw.decode("utf-8", errors="replace")}
          for codec in codecs:
              try:
                  logical_texts.add(raw.decode(codec, errors="strict"))
              except (LookupError, UnicodeDecodeError):
                  continue

          digests: set[str] = set()
          '''
          new = '''    decoded_texts = {raw.decode("utf-8", errors="replace")}
          for codec in codecs:
              try:
                  decoded_texts.add(raw.decode(codec, errors="strict"))
              except (LookupError, UnicodeDecodeError):
                  continue

          # v1 used subprocess text mode, which normalized CRLF before hashing.
          # Preserve both forms when reconstructing an old marker from the current
          # localized icacls output.
          logical_texts = set(decoded_texts)
          logical_texts.update(
              text.replace("\\r\\n", "\\n").replace("\\r", "\\n")
              for text in decoded_texts
          )

          digests: set[str] = set()
          '''
          if config.count(old) != 1:
              raise SystemExit(f'legacy newline patch target count={config.count(old)}')
          config_path.write_text(config.replace(old, new, 1), encoding='utf-8')

          tunnel_path = Path('secure-mcp-tunnel.ps1')
          raw = tunnel_path.read_bytes()
          has_bom = raw.startswith(b'\xef\xbb\xbf')
          tunnel = raw.decode('utf-8-sig')
          old_tunnel = '$output = @(& $PythonPath -I -B -c $probe 2>$null)'
          new_tunnel = '$output = @(& $PythonPath -X utf8 -I -B -c $probe 2>$null)'
          if tunnel.count(old_tunnel) != 1:
              raise SystemExit(f'Tunnel Python probe target count={tunnel.count(old_tunnel)}')
          tunnel = tunnel.replace(old_tunnel, new_tunnel, 1)
          tunnel_path.write_bytes((b'\xef\xbb\xbf' if has_bom else b'') + tunnel.encode('utf-8'))

          test_path = Path('tests/test_config.py')
          tests = test_path.read_text(encoding='utf-8')
          old_test = '''    legacy_raw = logical.encode("cp932")
          legacy_text = legacy_raw.decode("utf-8", errors="replace")
          legacy_digest = hashlib.sha256(legacy_text.encode("utf-8")).hexdigest()
          '''
          new_test = '''    legacy_raw = logical.encode("cp932")
          legacy_text = legacy_raw.decode("utf-8", errors="replace")
          legacy_text = legacy_text.replace("\\r\\n", "\\n").replace("\\r", "\\n")
          legacy_digest = hashlib.sha256(legacy_text.encode("utf-8")).hexdigest()
          '''
          if tests.count(old_test) != 1:
              raise SystemExit(f'legacy test target count={tests.count(old_test)}')
          test_path.write_text(tests.replace(old_test, new_test, 1), encoding='utf-8')

          launcher_path = Path('tests/test_local_launchers.py')
          launcher = launcher_path.read_text(encoding='utf-8')
          old_assert = '''    assert f'data_dir = "{toml_path(new_data_dir)}"' in config.read_text(encoding="utf-8")
          '''
          new_assert = '''    saved_data_dir = next(
              line.split("=", 1)[1].strip().strip('"').replace("\\\\", "\\")
              for line in config.read_text(encoding="utf-8").splitlines()
              if line.startswith("data_dir = ")
          )
          assert Path(saved_data_dir).samefile(new_data_dir)
          '''
          if launcher.count(old_assert) != 1:
              raise SystemExit(f'launcher assertion target count={launcher.count(old_assert)}')
          launcher_path.write_text(launcher.replace(old_assert, new_assert, 1), encoding='utf-8')
          PY

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Python and ACL regression tests
        shell: pwsh
        run: |
          python -m pytest tests/test_config.py tests/test_setup_python_diagnostics.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Launcher regression tests
        shell: pwsh
        run: |
          python -m pytest tests/test_local_launchers.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ruff
        shell: pwsh
        run: |
          python -m ruff check src/windows_local_mcp/config.py tests/test_config.py tests/test_setup_python_diagnostics.py tests/test_local_launchers.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit fixes to branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows_local_mcp/config.py setup-localmcp.ps1 secure-mcp-tunnel.ps1 tests/test_config.py tests/test_local_launchers.py
          git commit -m "fix: data_dir ACL検証をコードページ非依存化"
          git push origin HEAD:fix/data-dir-acl-fingerprint
