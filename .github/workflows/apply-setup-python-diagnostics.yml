name: Apply setup Python diagnostics fix

on:
  push:
    branches: [fix/setup-python-diagnostics]
    paths: [.github/workflows/apply-setup-python-diagnostics.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/setup-python-diagnostics

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Patch setup diagnostics and add regression tests
        shell: pwsh
        run: |
          $path = 'setup-localmcp.ps1'
          $bytes = [IO.File]::ReadAllBytes($path)
          $bom = [byte[]](0xEF, 0xBB, 0xBF)
          $offset = 0
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            $offset = 3
          }
          $text = [Text.UTF8Encoding]::new($false, $true).GetString($bytes, $offset, $bytes.Length - $offset)
          $newline = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }

          $old = @'
          function Invoke-Python {
              param(
                  [Parameter(Mandatory = $true)][string]$PythonPath,
                  [Parameter(Mandatory = $true)][string[]]$Arguments
              )

              $output = & $PythonPath @Arguments 2>&1
              $exitCode = $LASTEXITCODE
              if ($exitCode -ne 0) {
                  $details = ($output | Out-String).Trim()
                  if ([string]::IsNullOrWhiteSpace($details)) {
                      $details = "終了コード $exitCode"
                  }
                  throw "Python の処理に失敗しました: $details"
              }
              return $output
          }
          '@
          $new = @'
          function Invoke-Python {
              param(
                  [Parameter(Mandatory = $true)][string]$PythonPath,
                  [Parameter(Mandatory = $true)][string[]]$Arguments
              )

              if (-not (Test-Path -LiteralPath $PythonPath -PathType Leaf)) {
                  throw "Python executable が見つかりません: $PythonPath"
              }

              # Windows PowerShell 5.1 treats native stderr records as PowerShell errors when
              # $ErrorActionPreference is Stop. Temporarily collect them non-terminating so a
              # multi-line Python traceback is preserved and can be reported with the exit code.
              # Force UTF-8 only for this child process so non-ASCII paths do not depend on the
              # host console code page, then restore the caller's environment exactly.
              $previousErrorActionPreference = $ErrorActionPreference
              $previousPythonIoEncoding = $env:PYTHONIOENCODING
              $output = @()
              $exitCode = $null
              try {
                  $ErrorActionPreference = "Continue"
                  $env:PYTHONIOENCODING = "utf-8"
                  $output = @(& $PythonPath @Arguments 2>&1)
                  $exitCode = $LASTEXITCODE
              } finally {
                  $ErrorActionPreference = $previousErrorActionPreference
                  if ($null -eq $previousPythonIoEncoding) {
                      Remove-Item Env:PYTHONIOENCODING -ErrorAction SilentlyContinue
                  } else {
                      $env:PYTHONIOENCODING = $previousPythonIoEncoding
                  }
              }

              $lines = @($output | ForEach-Object { $_.ToString() })
              if ($null -eq $exitCode) {
                  throw "Python の処理を開始できませんでした: $PythonPath"
              }
              if ($exitCode -ne 0) {
                  $details = ($lines -join [Environment]::NewLine).Trim()
                  if ([string]::IsNullOrWhiteSpace($details)) {
                      $details = "標準出力・標準エラーに詳細はありません。"
                  }
                  throw "Python の処理に失敗しました（終了コード $exitCode）: $details"
              }
              return $lines
          }
          '@
          $old = $old.Trim().Replace("`r`n", "`n").Replace("`n", $newline)
          $new = $new.Trim().Replace("`r`n", "`n").Replace("`n", $newline)
          $matches = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($matches -ne 1) {
            throw "Invoke-Python patch target count was $matches, expected 1"
          }
          $text = $text.Replace($old, $new)
          $payload = [Text.UTF8Encoding]::new($true).GetBytes($text)
          [IO.File]::WriteAllBytes($path, $payload)

          $testBase64 = ''
          [IO.File]::WriteAllBytes('tests/test_setup_python_diagnostics.py', [Convert]::FromBase64String($testBase64))

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Focused regression tests
        run: |
          python -m pytest -q tests/test_setup_python_diagnostics.py
          python -m pytest -q tests/test_local_launchers.py::test_settings_menu_displays_summary_and_atomically_changes_workspace
          python -m ruff check tests/test_setup_python_diagnostics.py

      - name: Commit fix to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setup-localmcp.ps1 tests/test_setup_python_diagnostics.py
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: setupのPython診断出力を保持"
          git push origin HEAD:fix/setup-python-diagnostics
