name: Finalize setup Python diagnostics fix

on:
  push:
    branches: [fix/setup-python-diagnostics]
    paths: [.github/workflows/apply-setup-python-diagnostics.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/setup-python-diagnostics

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore UTF-8 BOM when needed
        shell: pwsh
        run: |
          $path = 'setup-localmcp.ps1'
          $bytes = [IO.File]::ReadAllBytes($path)
          $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
          if (-not $hasBom) {
            $bom = [byte[]](0xEF, 0xBB, 0xBF)
            $combined = New-Object byte[] ($bom.Length + $bytes.Length)
            [Array]::Copy($bom, 0, $combined, 0, $bom.Length)
            [Array]::Copy($bytes, 0, $combined, $bom.Length, $bytes.Length)
            [IO.File]::WriteAllBytes($path, $combined)
          }
          $after = [IO.File]::ReadAllBytes($path)
          if (-not ($after.Length -ge 3 -and $after[0] -eq 0xEF -and $after[1] -eq 0xBB -and $after[2] -eq 0xBF)) {
            throw 'setup-localmcp.ps1 UTF-8 BOM is missing'
          }

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Focused regression tests
        run: |
          python -m pytest -q tests/test_setup_python_diagnostics.py
          python -m pytest -q tests/test_local_launchers.py::test_windows_powershell_51_launchers_use_utf8_bom_and_keep_japanese
          python -m pytest -q tests/test_local_launchers.py::test_launcher_parses_with_windows_powershell_51
          python -m pytest -q tests/test_local_launchers.py::test_settings_menu_displays_summary_and_atomically_changes_workspace
          python -m ruff check tests/test_setup_python_diagnostics.py

      - name: Commit BOM preservation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setup-localmcp.ps1
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "BOM already correct"
          else
            git commit -m "fix: setup launcherのUTF-8 BOMを維持"
            git push origin HEAD:fix/setup-python-diagnostics
          fi
