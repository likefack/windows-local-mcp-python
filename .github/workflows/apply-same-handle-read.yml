name: Apply same-handle workspace read hardening

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply-and-verify:
    if: github.event.issue.title == '[WLMCP] same-handle read apply'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base SHA
        id: base
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        id: patch
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/_same_handle_read_fix.py 2>&1 | Tee-Object -FilePath patch.log
          exit $LASTEXITCODE

      - name: Install package and dev checks
        id: install
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --upgrade pip 2>&1 | Tee-Object -FilePath install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev]" 2>&1 | Tee-Object -FilePath install.log -Append
          exit $LASTEXITCODE

      - name: Focused same-handle and mutation tests
        id: focused
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pytest -q tests/test_same_handle_reads.py tests/test_paths.py tests/test_server_operations.py tests/test_structured_files.py tests/test_broker_architecture.py tests/test_timeline_and_rollback.py 2>&1 | Tee-Object -FilePath focused.log
          exit $LASTEXITCODE

      - name: Full pytest
        id: full_pytest
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pytest 2>&1 | Tee-Object -FilePath full-pytest.log
          exit $LASTEXITCODE

      - name: Ruff
        id: ruff
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m ruff check . 2>&1 | Tee-Object -FilePath ruff.log
          exit $LASTEXITCODE

      - name: Compile all
        id: compileall
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m compileall -q src tests tools/_same_handle_read_fix.py 2>&1 | Tee-Object -FilePath compileall.log
          exit $LASTEXITCODE

      - name: Diff whitespace check
        id: diff_check
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: git diff --check 2>&1 | tee diff-check.log

      - name: Commit verified fix
        id: commit
        if: >-
          steps.patch.outcome == 'success' &&
          steps.install.outcome == 'success' &&
          steps.focused.outcome == 'success' &&
          steps.full_pytest.outcome == 'success' &&
          steps.ruff.outcome == 'success' &&
          steps.compileall.outcome == 'success' &&
          steps.diff_check.outcome == 'success'
        shell: pwsh
        run: |
          Remove-Item tools/_same_handle_read_fix.py
          Remove-Item .github/workflows/apply-same-handle-read.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: bind verified workspace reads to same handle"
          git push origin HEAD:main
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Report verification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = {
              patch: '${{ steps.patch.outcome }}',
              install: '${{ steps.install.outcome }}',
              focused: '${{ steps.focused.outcome }}',
              full_pytest: '${{ steps.full_pytest.outcome }}',
              ruff: '${{ steps.ruff.outcome }}',
              compileall: '${{ steps.compileall.outcome }}',
              diff_check: '${{ steps.diff_check.outcome }}',
              commit: '${{ steps.commit.outcome }}',
            };
            const passed = Object.values(results).every((v) => v === 'success');
            const lines = [
              `Base: \`${{ steps.base.outputs.sha }}\``,
              `Final: \`${{ steps.commit.outputs.sha }}\``,
              '',
              '| check | outcome |',
              '| --- | --- |',
              ...Object.entries(results).map(([k, v]) => `| ${k} | ${v} |`),
              '',
              `Overall: **${passed ? 'PASS' : 'FAIL'}**`,
            ];
            const logs = {
              patch: 'patch.log', install: 'install.log', focused: 'focused.log',
              full_pytest: 'full-pytest.log', ruff: 'ruff.log',
              compileall: 'compileall.log', diff_check: 'diff-check.log',
            };
            for (const [name, outcome] of Object.entries(results)) {
              const path = logs[name];
              if (outcome === 'success' || !path || !fs.existsSync(path)) continue;
              const text = fs.readFileSync(path, 'utf8');
              lines.push('', `### ${name} log tail`, '', '```text', text.slice(-14000), '```');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });

      - name: Fail if verification did not commit
        if: always() && steps.commit.outcome != 'success'
        shell: pwsh
        run: |
          Write-Error "same-handle read hardening did not pass all verification gates"
          exit 1
