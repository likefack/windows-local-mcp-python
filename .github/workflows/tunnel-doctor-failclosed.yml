name: Tunnel doctor fail-closed validation

on:
  push:
    branches:
      - fix/tunnel-setup-diagnostics

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/tunnel-setup-diagnostics
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply fail-closed patch
        shell: pwsh
        run: |
          python .dev-tmp/apply_tunnel_doctor_failclosed.py
          python -m ruff check --fix tests/test_tunnel_setup_diagnostics.py

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'secure-mcp-tunnel.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'secure-mcp-tunnel.ps1 parse failed'
          }

      - name: Focused regressions
        shell: pwsh
        run: |
          python -m pytest tests/test_tunnel_setup_diagnostics.py tests/test_tunnel_integration.py tests/test_local_launchers.py -q
          python -m ruff check tests/test_tunnel_setup_diagnostics.py tests/test_local_launchers.py

      - name: Commit validated fail-closed fix
        if: success()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .dev-tmp/apply_tunnel_doctor_failclosed.py .github/workflows/tunnel-doctor-failclosed.yml
          git add secure-mcp-tunnel.ps1 tests/test_tunnel_setup_diagnostics.py
          git commit -m "fix: Tunnel doctor診断をfail closedにする"
          git push origin HEAD:fix/tunnel-setup-diagnostics
