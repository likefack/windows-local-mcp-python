name: Apply final same-handle workspace read sink

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply-and-verify:
    if: github.event.issue.title == '[WLMCP] final same-handle sink apply'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: base
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final sink patch
        id: patch
        continue-on-error: true
        shell: pwsh
        run: python tools/_dart_same_handle_fix.py
      - name: Install
        id: install
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: python -m pip install -e ".[dev]"
      - name: Focused tests
        id: focused
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: python -m pytest -q tests/test_same_handle_reads.py tests/test_approval.py tests/test_approval_execution_integration.py tests/test_paths.py tests/test_server_operations.py tests/test_structured_files.py tests/test_timeline_and_rollback.py
      - name: Full pytest
        id: full_pytest
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: python -m pytest
      - name: Ruff
        id: ruff
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: python -m ruff check .
      - name: Compile
        id: compileall
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: python -m compileall -q src tests
      - name: Diff check
        id: diff_check
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: git diff --check
      - name: Commit verified fix
        id: commit
        if: >-
          steps.patch.outcome == 'success' &&
          steps.install.outcome == 'success' &&
          steps.focused.outcome == 'success' &&
          steps.full_pytest.outcome == 'success' &&
          steps.ruff.outcome == 'success' &&
          steps.compileall.outcome == 'success' &&
          steps.diff_check.outcome == 'success'
        shell: pwsh
        run: |
          Remove-Item tools/_dart_same_handle_fix.py
          Remove-Item .github/workflows/apply-dart-same-handle.yml
          git add src/windows_local_mcp/approval.py tests/test_same_handle_reads.py tools/_dart_same_handle_fix.py .github/workflows/apply-dart-same-handle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: bind Dart staging read to verified handle"
          git push origin HEAD:main
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              patch: '${{ steps.patch.outcome }}', install: '${{ steps.install.outcome }}',
              focused: '${{ steps.focused.outcome }}', full_pytest: '${{ steps.full_pytest.outcome }}',
              ruff: '${{ steps.ruff.outcome }}', compileall: '${{ steps.compileall.outcome }}',
              diff_check: '${{ steps.diff_check.outcome }}', commit: '${{ steps.commit.outcome }}'
            };
            const passed = Object.values(results).every(v => v === 'success');
            const body = [
              `Base: \`${{ steps.base.outputs.sha }}\``, `Final: \`${{ steps.commit.outputs.sha }}\``, '',
              '| check | outcome |', '| --- | --- |',
              ...Object.entries(results).map(([k,v]) => `| ${k} | ${v} |`), '',
              `Overall: **${passed ? 'PASS' : 'FAIL'}**`
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
      - name: Fail unless committed
        if: always() && steps.commit.outcome != 'success'
        shell: pwsh
        run: exit 1
