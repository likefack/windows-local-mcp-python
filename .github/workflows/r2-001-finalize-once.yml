name: R2-001 Finalize Once

on:
  push:
    branches:
      - fix/wlmcp-r2-001-root

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Apply WLMCP-R2-001 finalize patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/wlmcp-r2-001-root
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install 'ruff>=0.12,<1'

      - name: Harden regex replacement handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/r2_001_finalize_patch.py')
          text = path.read_text(encoding='utf-8')
          old = 'updated, actual = re.subn(pattern, replacement, text, count=count, flags=re.DOTALL)'
          new = 'updated, actual = re.subn(pattern, lambda _match: replacement, text, count=count, flags=re.DOTALL)'
          if text.count(old) != 1:
              raise SystemExit('finalize replacement helper changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Apply exact finalize patch
        run: python scripts/r2_001_finalize_patch.py

      - name: Apply remaining deterministic lint fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/windows_local_mcp/approved_host_authority.py')
          text = path.read_text(encoding='utf-8')
          old = '        if not _kernel32.WaitNamedPipeW(APPROVED_HOST_AUTHORITY_PIPE, remaining_ms):\n            if time.monotonic() >= deadline:\n                raise _winerror("WaitNamedPipeW")\n'
          new = '        if (\n            not _kernel32.WaitNamedPipeW(APPROVED_HOST_AUTHORITY_PIPE, remaining_ms)\n            and time.monotonic() >= deadline\n        ):\n            raise _winerror("WaitNamedPipeW")\n'
          if text.count(old) != 1:
              raise SystemExit('WaitNamedPipeW lint target changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Apply safe Ruff fixes
        run: python -m ruff check --fix src tests scripts

      - name: Verify Ruff
        run: python -m ruff check src tests scripts

      - name: Verify whitespace
        run: git diff --check

      - name: Commit finalized branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Finalize patch produced no changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SECURITY_CONTRACT.md SPEC.md README.md VERIFICATION.md .github/workflows/finalize-atomic-commit.yml src tests scripts
          git commit -m 'Apply WLMCP-R2-001 finalize patch'
          git push origin HEAD:fix/wlmcp-r2-001-root
