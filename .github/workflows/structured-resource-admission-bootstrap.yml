name: Structured resource admission bootstrap

on:
  push:
    branches: ["fix/structured-resource-admission"]
    paths: [".github/workflows/structured-resource-admission-bootstrap.yml"]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/structured-resource-admission
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Apply structured resource admission patch
        run: python tools/structured_resource_admission_patch.py

      - name: Focused structured resource regression
        run: >-
          python -m pytest -q
          tests/test_structured_resource_admission.py
          tests/test_structured_files.py

      - name: Full pytest
        run: python -m pytest

      - name: Ruff
        run: python -m ruff check .

      - name: Compile all
        run: python -m compileall -q src tests

      - name: Diff whitespace check
        shell: bash
        run: git diff --check

      - name: Commit verified implementation
        shell: pwsh
        run: |
          Remove-Item .github/workflows/structured-resource-admission-bootstrap.yml
          Remove-Item tools/structured_resource_admission_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows_local_mcp/structured_files.py tests/test_structured_resource_admission.py VERIFICATION.md .github/workflows/structured-resource-admission-bootstrap.yml tools/structured_resource_admission_patch.py
          git commit -m "構造化処理の事前リソース境界を追加"
          git push origin HEAD:fix/structured-resource-admission
