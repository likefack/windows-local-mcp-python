name: fix-snapshot-only-runner

on:
  push:
    branches: [fix-snapshot-only-runner]

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: windows-2025
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prepare exact main and apply patch
        shell: pwsh
        run: |
          $expected = '5d4f8eaed016a7c139e240fcb33bd9c749658d20'
          $patcher = Join-Path $env:RUNNER_TEMP 'fix_snapshot_only.py'
          Copy-Item .github/fix_snapshot_only.py $patcher
          $remote = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($remote -ne $expected) { throw "main moved before patch: $remote" }
          git checkout --detach $expected
          git clean -fdx
          if ((git rev-parse HEAD).Trim() -ne $expected) { throw 'unexpected checkout revision' }
          python $patcher
          git diff --check

      - name: Verify patch scope
        shell: pwsh
        run: |
          $expected = @(
            'README.md',
            'SECURITY_CONTRACT.md',
            'SPEC.md',
            'VERIFICATION.md',
            'src/windows_local_mcp/approval.py',
            'src/windows_local_mcp/config.py',
            'src/windows_local_mcp/sandbox_backend.py',
            'src/windows_local_mcp/sandbox_live_verify.py',
            'src/windows_local_mcp/server.py',
            'tests/test_approval.py',
            'tests/test_sandbox_architecture.py',
            'tests/test_server_operations.py'
          ) | Sort-Object
          $actual = @(git diff --name-only) | Sort-Object
          if (($expected -join "`n") -ne ($actual -join "`n")) {
            Write-Host 'Expected:'; $expected | ForEach-Object { Write-Host $_ }
            Write-Host 'Actual:'; $actual | ForEach-Object { Write-Host $_ }
            throw 'unexpected patch scope'
          }
          git diff --stat

      - name: Install checks
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Focused security regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_approval.py tests/test_sandbox_architecture.py tests/test_server_operations.py tests/test_worker_lock_policy.py
          python -m pytest -q tests/test_approval_execution_integration.py -k "local_approval_rejects_changed_transitive_live_workspace_input or snapshot_execution_succeeds_when_bound_workspace_is_unchanged"

      - name: Stable regression suite
        shell: pwsh
        run: |
          python -m pytest -q --ignore=tests/test_active_config_security_integration.py --ignore=tests/test_approval_execution_integration.py --ignore=tests/test_approved_host_audit_integrity.py --ignore=tests/test_broker_architecture.py --ignore=tests/test_directory_toctou.py --ignore=tests/test_mcp_stdio_integration.py --ignore=tests/test_same_handle_reads.py

      - name: Static checks
        shell: pwsh
        run: |
          python -m ruff check src tests
          python -m compileall -q src tests
          git diff --check

      - name: Bypass review assertions
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from windows_local_mcp.approval import PROJECT_CONTROLLED_CODE_LOADERS; assert {'python','node','powershell','flutter'} <= PROJECT_CONTROLLED_CODE_LOADERS"
          python -c "from pathlib import Path; from windows_local_mcp.config import Settings; from windows_local_mcp.sandbox_backend import codex_sandbox_state; r=Path('.dev-tmp/review').resolve(); w=r/'workspace'; w.mkdir(parents=True); s=Settings(workspace_root=w,data_dir=r/'data',protect_data_dir_acl=False); s.ensure_directories(); t=r/'tool'/'python.exe'; t.parent.mkdir(parents=True); t.write_bytes(b'tool'); q=s.sandbox_scratch_dir/'runs'/'review'; q.mkdir(parents=True); e=codex_sandbox_state(s,command=[str(t)],cwd=q,writable_roots=(q,))['permissionProfile']['file_system']['entries']; p=str(s.workspace_root.resolve()); assert {'path':{'type':'path','path':p},'access':'deny'} in e; assert {'path':{'type':'path','path':p},'access':'read'} not in e"
          Remove-Item -Recurse -Force .dev-tmp/review

      - name: Commit verified fix to main
        shell: pwsh
        run: |
          $expected = '5d4f8eaed016a7c139e240fcb33bd9c749658d20'
          $remote = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($remote -ne $expected) { throw "main moved during verification: $remote" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md SECURITY_CONTRACT.md SPEC.md VERIFICATION.md src/windows_local_mcp/approval.py src/windows_local_mcp/config.py src/windows_local_mcp/sandbox_backend.py src/windows_local_mcp/sandbox_live_verify.py src/windows_local_mcp/server.py tests/test_approval.py tests/test_sandbox_architecture.py tests/test_server_operations.py
          git diff --cached --check
          git commit -m 'Sandbox実行をsnapshotに隔離'
          git push origin HEAD:main
