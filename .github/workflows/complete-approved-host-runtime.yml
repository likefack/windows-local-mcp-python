name: Complete Approved Host runtime

on:
  push:
    branches: [fix/approved-host-runtime-completion]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approved-host-runtime-completion
  cancel-in-progress: true

jobs:
  complete:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v7
        with:
          ref: fix/approved-host-runtime-completion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install baseline package and dev checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Capture baseline Approved Host integration failures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pytest -q `
            tests/test_active_config_security_integration.py `
            tests/test_approval_execution_integration.py `
            tests/test_approved_host_audit_integrity.py `
            tests/test_server_operations.py `
            --junitxml=.dev-tmp/baseline-approved-host.xml
          Write-Host "baseline Approved Host exit code: $LASTEXITCODE"
          exit 0

      - name: Capture baseline full pytest failures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pytest -q --junitxml=.dev-tmp/baseline-full.xml
          Write-Host "baseline full pytest exit code: $LASTEXITCODE"
          exit 0

      - name: Apply scoped completion patch
        run: python .github/complete_approved_host_runtime.py

      - name: Runtime trust and immutability tests
        run: >-
          python -m pytest -q
          tests/test_runtime_trust.py
          tests/test_runtime_immutability.py
          tests/test_runtime_immutability_lexical_scope.py
          tests/test_approved_host_runtime_scope.py
          tests/test_runtime_closure_isolation.py
          tests/test_powershell_scripts.py

      - name: Capture candidate Approved Host integration failures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pytest -q `
            tests/test_active_config_security_integration.py `
            tests/test_approval_execution_integration.py `
            tests/test_approved_host_audit_integrity.py `
            tests/test_server_operations.py `
            --junitxml=.dev-tmp/candidate-approved-host.xml
          Write-Host "candidate Approved Host exit code: $LASTEXITCODE"
          exit 0

      - name: Reject new Approved Host integration failures
        run: >-
          python .github/compare_pytest_failures.py
          .dev-tmp/baseline-approved-host.xml
          .dev-tmp/candidate-approved-host.xml

      - name: Capture candidate full pytest failures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pytest -q --junitxml=.dev-tmp/candidate-full.xml
          Write-Host "candidate full pytest exit code: $LASTEXITCODE"
          exit 0

      - name: Reject new full pytest failures
        run: >-
          python .github/compare_pytest_failures.py
          .dev-tmp/baseline-full.xml
          .dev-tmp/candidate-full.xml

      - name: Ruff changed code
        run: |
          python -m ruff check --fix tests/test_runtime_closure_isolation.py
          python -m ruff check src/windows_local_mcp/runtime_immutability.py src/windows_local_mcp/server.py tests/test_approved_host_runtime_scope.py tests/test_server_operations.py tests/test_runtime_closure_isolation.py

      - name: Compile all
        run: python -m compileall -q src tests

      - name: Diff whitespace check
        shell: bash
        run: git diff --check

      - name: Commit verified target changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/APPROVED_HOST_RUNTIME.md install-approved-host-runtime.ps1
          git add src/windows_local_mcp/runtime_immutability.py src/windows_local_mcp/server.py
          git add tests/test_approved_host_runtime_scope.py tests/test_server_operations.py
          git add tests/test_runtime_closure_isolation.py
          git rm .github/complete_approved_host_runtime.py .github/compare_pytest_failures.py .github/workflows/complete-approved-host-runtime.yml
          git diff --cached --check
          git commit -m "Approved Host runtime境界を完了 [skip ci]"
          git push origin HEAD:fix/approved-host-runtime-completion
