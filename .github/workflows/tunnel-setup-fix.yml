name: Tunnel setup fix validation

on:
  push:
    branches:
      - fix/tunnel-setup-diagnostics

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/tunnel-setup-diagnostics
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply focused fix
        shell: pwsh
        run: |
          python .dev-tmp/apply_tunnel_setup_fix.py
          python .dev-tmp/apply_tunnel_setup_fix2.py
          python .dev-tmp/apply_tunnel_setup_fix3.py
          python .dev-tmp/apply_tunnel_setup_fix4.py
          python -m ruff check --fix tests/test_tunnel_setup_diagnostics.py tests/test_local_launchers.py

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('setup-localmcp.ps1', 'secure-mcp-tunnel.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$path parse failed"
            }
          }

      - name: Focused regressions
        shell: pwsh
        run: |
          python -m pytest tests/test_tunnel_setup_diagnostics.py tests/test_setup_python_diagnostics.py tests/test_tunnel_integration.py tests/test_local_launchers.py -q

      - name: Validate official tunnel-client v0.0.10 doctor JSON
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'tunnel-client-v0.0.10-windows-amd64.zip'
          $unpack = Join-Path $env:RUNNER_TEMP 'tunnel-client-v0.0.10'
          Invoke-WebRequest -Uri 'https://github.com/openai/tunnel-client/releases/download/v0.0.10/tunnel-client-v0.0.10-windows-amd64.zip' -OutFile $zip
          $expectedZipSha256 = '5e64a056f1d96786da0a6f8db1da5f5f4a03fd19a90d951a25cf2ca8d9093d00'
          $actualZipSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actualZipSha256 -ne $expectedZipSha256) { throw "official tunnel-client ZIP digest mismatch: $actualZipSha256" }
          Expand-Archive -LiteralPath $zip -DestinationPath $unpack -Force
          $client = Get-ChildItem -LiteralPath $unpack -Filter tunnel-client.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $client) { throw 'tunnel-client.exe missing from official archive' }

          . .\secure-mcp-tunnel.ps1
          $probeRoot = Join-Path $env:RUNNER_TEMP 'wlmcp-tunnel-doctor-probe'
          New-Item -ItemType Directory -Path $probeRoot -Force | Out-Null
          $config = Join-Path $probeRoot 'config.toml'
          $profile = Join-Path $probeRoot 'profile.yaml'
          [IO.File]::WriteAllText($config, 'workspace_root = "C:\\Users\\Public\\workspace"' + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          $profileText = New-TunnelProfileContent `
            -TunnelId 'tunnel_0123456789abcdef0123456789abcdef' `
            -ServerScript (Resolve-Path .\run-server.ps1).Path `
            -ConfigPath $config `
            -PidFile (Join-Path $probeRoot 'tunnel.pid') `
            -HealthUrlFile (Join-Path $probeRoot 'health-url.txt')
          [IO.File]::WriteAllText($profile, $profileText, [Text.UTF8Encoding]::new($false))

          $secretText = 'rk-local-validation-do-not-use-0123456789'
          $secret = [Security.SecureString]::new()
          foreach ($character in $secretText.ToCharArray()) { $secret.AppendChar($character) }
          $secret.MakeReadOnly()
          try {
            $doctor = Invoke-TunnelClientDoctor -ClientPath $client.FullName -ProfilePath $profile -Credential $secret
          } finally {
            $secret.Dispose()
          }
          if ($null -eq $doctor.Report) { throw "official doctor JSON was not parsed: $($doctor.FallbackText)" }
          $criticalIds = @('config_source', 'profile_load', 'tunnel_id', 'control_plane_api_key', 'mcp_target', 'mcp_command_executable')
          $criticalFailures = @($doctor.Report.Checks | Where-Object { $_.Status -eq 'FAIL' -and $_.Id -in $criticalIds })
          if ($criticalFailures.Count -gt 0) {
            $details = ($criticalFailures | ForEach-Object { "$($_.Id): $($_.Summary)" }) -join '; '
            throw "official doctor rejected generated managed profile: $details"
          }
          $serialized = $doctor.Report | ConvertTo-Json -Depth 8 -Compress
          if ($serialized.Contains($secretText) -or ([string]$doctor.FallbackText).Contains($secretText)) { throw 'doctor diagnostics leaked runtime API key' }
          Write-Host "official tunnel-client doctor JSON validated; result=$($doctor.Report.Result); failed=$(@($doctor.Report.FailedChecks) -join ',')"

      - name: Ruff
        shell: pwsh
        run: python -m ruff check tests/test_tunnel_setup_diagnostics.py tests/test_local_launchers.py

      - name: Commit validated fix
        if: success()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .dev-tmp/apply_tunnel_setup_fix.py .dev-tmp/apply_tunnel_setup_fix2.py .dev-tmp/apply_tunnel_setup_fix3.py .dev-tmp/apply_tunnel_setup_fix4.py .github/workflows/tunnel-setup-fix.yml
          git add setup-localmcp.ps1 secure-mcp-tunnel.ps1 tests/test_tunnel_setup_diagnostics.py tests/test_local_launchers.py
          git commit -m "fix: Tunnel設定の診断と検出UXを改善"
          git push origin HEAD:fix/tunnel-setup-diagnostics
