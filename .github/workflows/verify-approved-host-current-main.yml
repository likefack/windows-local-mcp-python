name: Verify Approved Host current main

on:
  push:
    branches: [fix/approved-host-current-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-approved-host-current-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/approved-host-current-main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Focused Approved Host
        run: >-
          python -m pytest -q
          tests/test_approval_execution_integration.py
          tests/test_approved_host_audit_integrity.py
          tests/test_broker_architecture.py
          tests/test_runtime_trust.py
      - name: Repeat active-config tamper
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            python -m pytest -q tests/test_active_config_security_integration.py -k real_approved_host_config_tamper_fails_closed
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
