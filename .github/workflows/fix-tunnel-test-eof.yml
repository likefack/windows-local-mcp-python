name: Fix Tunnel test EOF

on:
  push:
    branches:
      - work/rebuild-tunnel-ux-latest-main

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-2025
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v7
        with:
          ref: work/rebuild-tunnel-ux-latest-main
          fetch-depth: 0

      - name: Normalize EOF
        shell: pwsh
        run: python .dev-tmp/fix_tunnel_test_eof.py

      - name: Verify whitespace against main
        shell: bash
        run: git diff --check origin/main -- tests/test_tunnel_integration.py

      - name: Commit normalized final tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .dev-tmp/fix_tunnel_test_eof.py .github/workflows/fix-tunnel-test-eof.yml
          git add tests/test_tunnel_integration.py
          git commit -m "test: Tunnel回帰テストの末尾空行を整理"
          git push origin HEAD:work/rebuild-tunnel-ux-latest-main
