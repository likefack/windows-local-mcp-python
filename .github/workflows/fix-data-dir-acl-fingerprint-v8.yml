name: Fix data_dir ACL fingerprint v8

on:
  push:
    branches: [fix/data-dir-acl-fingerprint]
    paths: [.github/workflows/fix-data-dir-acl-fingerprint-v8.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/data-dir-acl-fingerprint
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Patch source and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/windows_local_mcp/config.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line == '    logical_texts = {raw.decode("utf-8", errors="replace")}')
          end = next(i for i in range(start, len(lines)) if lines[i] == '    digests: set[str] = set()')
          lines[start:end + 1] = [
              '    decoded_texts = {raw.decode("utf-8", errors="replace")}',
              '    for codec in codecs:',
              '        try:',
              '            decoded_texts.add(raw.decode(codec, errors="strict"))',
              '        except (LookupError, UnicodeDecodeError):',
              '            continue',
              '',
              '    # v1 used subprocess text mode, which normalized CRLF before hashing.',
              '    # Preserve both forms when reconstructing a marker from localized icacls output.',
              '    logical_texts = set(decoded_texts)',
              '    logical_texts.update(',
              r'        text.replace("\r\n", "\n").replace("\r", "\n")',
              '        for text in decoded_texts',
              '    )',
              '',
              '    digests: set[str] = set()',
          ]
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          p = Path('secure-mcp-tunnel.ps1')
          raw = p.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          s = raw.decode('utf-8-sig')
          old = '$output = @(& $PythonPath -I -B -c $probe 2>$null)'
          if s.count(old) != 1:
              raise SystemExit(f'tunnel replacement count={s.count(old)}')
          s = s.replace(old, '$output = @(& $PythonPath -X utf8 -I -B -c $probe 2>$null)', 1)
          p.write_bytes((b'\xef\xbb\xbf' if bom else b'') + s.encode('utf-8'))

          p = Path('tests/test_config.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          target = '    legacy_text = legacy_raw.decode("utf-8", errors="replace")'
          indices = [i for i, line in enumerate(lines) if line == target]
          if len(indices) != 1:
              raise SystemExit(f'test_config target count={len(indices)}')
          lines.insert(indices[0] + 1, r'    legacy_text = legacy_text.replace("\r\n", "\n").replace("\r", "\n")')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          p = Path('tests/test_local_launchers.py')
          s = p.read_text(encoding='utf-8')
          old = '    assert f\'data_dir = "{toml_path(new_data_dir)}"\' in config.read_text(encoding="utf-8")'
          new = '    assert f\'data_dir = "{toml_path(new_data_dir.resolve())}"\' in config.read_text(encoding="utf-8")'
          if s.count(old) != 1:
              raise SystemExit(f'launcher target count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Config and diagnostics tests
        shell: pwsh
        run: |
          python -m pytest tests/test_config.py tests/test_setup_python_diagnostics.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Launcher tests
        shell: pwsh
        run: |
          python -m pytest tests/test_local_launchers.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ruff
        shell: pwsh
        run: |
          python -m ruff check src/windows_local_mcp/config.py tests/test_config.py tests/test_setup_python_diagnostics.py tests/test_local_launchers.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit source fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows_local_mcp/config.py setup-localmcp.ps1 secure-mcp-tunnel.ps1 tests/test_config.py tests/test_local_launchers.py
          git commit -m "fix: data_dir ACL検証をコードページ非依存化"
          git push origin HEAD:fix/data-dir-acl-fingerprint
