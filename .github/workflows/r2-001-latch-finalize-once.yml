name: R2-001 Durable Latch Finalize Once

on:
  push:
    branches:
      - fix/wlmcp-r2-001-root

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Apply WLMCP-R2-001 durable latch hardening'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/wlmcp-r2-001-root
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dev checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Apply exact hardening
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} exact matches, got {actual}")
              target.write_text(text.replace(old, new, count), encoding="utf-8", newline="\n")

          replace(
              "src/windows_local_mcp/approved_host_policy.py",
              '''        if not bool(getattr(settings, "approved_host_enabled", False)):\n            return\n        if not _authority_service_installed():\n''',
              '''        if not _authority_service_installed():\n''',
          )

          replace(
              "src/windows_local_mcp/approved_host_authority.py",
              '''\n    def cancel(self, operation_id: str) -> dict[str, Any]:\n        return _authority_request({"action": "cancel", "operation_id": operation_id})\n''',
              '''\n''',
          )

          replace(
              "src/windows_local_mcp/executor.py",
              '''        if tier == "approved_host":\n            try:\n                runtime_trust = assert_approved_host_runtime_immutable()\n                authority_trust = assert_approved_host_authority_available()\n            except Exception as error:\n                self.audit.add_event(\n                    operation_id,\n                    "approved_host_authority_preflight_failed",\n                    {"error": f"{type(error).__name__}: {error}"[:1000]},\n                )\n                raise\n            self.audit.add_event(\n''',
              '''        if tier == "approved_host":\n            try:\n                runtime_trust = assert_approved_host_runtime_immutable()\n            except Exception as error:\n                self.audit.add_event(\n                    operation_id,\n                    "approved_host_runtime_immutability_failed",\n                    {"error": f"{type(error).__name__}: {error}"[:1000]},\n                )\n                raise\n            try:\n                authority_trust = assert_approved_host_authority_available()\n            except Exception as error:\n                self.audit.add_event(\n                    operation_id,\n                    "approved_host_authority_preflight_failed",\n                    {"error": f"{type(error).__name__}: {error}"[:1000]},\n                )\n                raise\n            self.audit.add_event(\n''',
          )

          policy_test = Path("tests/test_approved_host_policy.py")
          policy_text = policy_test.read_text(encoding="utf-8")
          addition = '''\n\ndef test_provisioned_authority_latch_is_checked_even_when_host_config_is_disabled(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    from windows_local_mcp import approved_host_policy, control_plane_guard\n\n    calls: list[str] = []\n\n    class DisabledSettings:\n        approved_host_enabled = False\n\n    class FakeAuthorityClient:\n        def assert_available(self) -> dict[str, object]:\n            calls.append("checked")\n            return {"healthy": True}\n\n    monkeypatch.setattr(control_plane_guard, "assert_control_plane_healthy", lambda _settings: None)\n    monkeypatch.setattr(approved_host_policy.os, "name", "nt")\n    monkeypatch.delenv("WINDOWS_LOCAL_MCP_AUTHORITY_WORKER", raising=False)\n    monkeypatch.setattr(approved_host_policy, "_authority_service_installed", lambda: True)\n    monkeypatch.setattr(approved_host_policy, "ApprovedHostAuthorityClient", FakeAuthorityClient)\n\n    approved_host_policy.install_approved_host_authority_health_gate()\n    control_plane_guard.assert_control_plane_healthy(DisabledSettings())\n\n    assert calls == ["checked"]\n'''
          if addition.strip() in policy_text:
              raise SystemExit("policy regression already exists unexpectedly")
          policy_test.write_text(policy_text.rstrip() + addition + "\n", encoding="utf-8", newline="\n")

          stop_test = Path("tests/test_approved_host_stop_boundary.py")
          stop_text = stop_test.read_text(encoding="utf-8")
          stop_addition = '''\n\ndef test_authority_client_exposes_no_runtime_user_monitor_cancel_rpc() -> None:\n    from windows_local_mcp.approved_host_authority import ApprovedHostAuthorityClient\n\n    assert not hasattr(ApprovedHostAuthorityClient(), "cancel")\n'''
          if stop_addition.strip() in stop_text:
              raise SystemExit("cancel-surface regression already exists unexpectedly")
          stop_test.write_text(stop_text.rstrip() + stop_addition + "\n", encoding="utf-8", newline="\n")

          replace(
              "SECURITY_CONTRACT.md",
              "service-owned durable `active.json` は normal verified completion まで immutable とし、worker kill、service restart、channel\nloss、postflight mismatch、Job 外 helper 残存では解除しません。active Approved Host monitor は runtime-user `stop_job` から\n停止できません。異常 state の解除は elevated Administrator による explicit reviewed recovery だけです。\n",
              "service-owned durable `active.json` は normal verified completion まで immutable とし、worker kill、service restart、channel\nloss、postflight mismatch、Job 外 helper 残存では解除しません。authority service が provision 済みである限り、user-owned\nconfiguration の `approved_host_enabled=false` は active／recovery latch の global health gate を無効化しません。active Approved Host\nmonitor は runtime-user `stop_job` から停止できません。異常 state の解除は elevated Administrator による explicit reviewed recovery だけです。\n",
          )

          replace(
              "docs/APPROVED_HOST_RUNTIME.md",
              "worker kill、unhandled exception、thread/process termination、channel loss、postflight failure、WMI／CIM helper 残存、service restart、epoch mismatch では normal proof が成立せず、`active.json` は残ります。service restart 中に active state を見つけた場合は `recovery_required` にします。旧 service epoch の proof を新 epoch で受理しません。\n",
              "worker kill、unhandled exception、thread/process termination、channel loss、postflight failure、WMI／CIM helper 残存、service restart、epoch mismatch では normal proof が成立せず、`active.json` は残ります。service restart 中に active state を見つけた場合は `recovery_required` にします。旧 service epoch の proof を新 epoch で受理しません。service が provision 済みなら、user-owned config で `approved_host_enabled=false` に変更しても active／recovery latch の global health check は継続します。\n",
          )
          '@ | Set-Content -LiteralPath .dev-r2-latch-finalize.py -Encoding utf8
          python .dev-r2-latch-finalize.py
          Remove-Item -LiteralPath .dev-r2-latch-finalize.py -Force

      - name: Ruff
        run: python -m ruff check src tests

      - name: Whitespace
        shell: bash
        run: git diff --check

      - name: Focused durable-latch regressions
        run: >-
          python -m pytest -q
          tests/test_approved_host_policy.py
          tests/test_approved_host_stop_boundary.py
          tests/test_runtime_immutability.py::test_executor_blocks_approved_host_before_worker_spawn
          tests/test_approved_host_fail_closed.py

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests SECURITY_CONTRACT.md docs/APPROVED_HOST_RUNTIME.md
          git commit -m 'Apply WLMCP-R2-001 durable latch hardening'
          git push origin HEAD:fix/wlmcp-r2-001-root
