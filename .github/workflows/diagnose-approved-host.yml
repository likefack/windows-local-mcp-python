name: Diagnose Approved Host residual failures

on:
  push:
    branches:
      - tmp/approved-host-diagnosis

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply candidate
        shell: pwsh
        run: |
          python .github/fix_snapshot_only.py
          python .github/fix_snapshot_only_followup.py
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -e ".[dev]"
      - name: Run residual tests
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pytest -q tests/test_approval_execution_integration.py -k "snapshot_execution_succeeds_when_bound_workspace_is_unchanged or approved_host_allows_legitimate_descendant_to_finish or approved_host_terminates_descendants_at_runtime_limit"
          python -m pytest -q tests/test_approved_host_audit_integrity.py -k "approved_host_trusted_audit_updates_remain_valid"
      - name: Dump audit state
        shell: pwsh
        run: python .github/diagnose_residual.py
