name: Diagnose Approved Host integration

on:
  push:
    branches: [fix/approved-host-production-finalize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-approved-host-production
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/approved-host-production-finalize
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Diagnose audit mirror
        run: python .github/diagnose_audit_mirror.py
