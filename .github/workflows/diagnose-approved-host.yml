name: Finalize Approved Host production

on:
  push:
    branches: [fix/approved-host-production-finalize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-approved-host-production
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Checkout finalization branch
        uses: actions/checkout@v7
        with:
          ref: fix/approved-host-production-finalize
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Merge latest main into validation branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          $main = (git rev-parse origin/main).Trim()
          "VALIDATED_MAIN_SHA=$main" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git merge --no-edit origin/main

      - name: Apply Approved Host completion patches
        run: |
          python .github/finalize_approved_host_production.py
          python .github/fix_approved_host_guard.py

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Runtime trust and immutability unit gates
        run: >-
          python -m pytest -q
          tests/test_runtime_trust.py
          tests/test_runtime_immutability.py
          tests/test_runtime_immutability_lexical_scope.py
          tests/test_approved_host_runtime_scope.py
          tests/test_runtime_closure_integration.py
          tests/test_powershell_scripts.py
          tests/test_broker_architecture.py::test_host_guard_binds_current_operation_approval_state
          tests/test_server_operations.py::test_approved_host_capability_does_not_preflight_when_disabled
          tests/test_server_operations.py::test_approved_host_capability_reports_failed_runtime_preflight
          tests/test_server_operations.py::test_approved_host_capability_reports_passed_runtime_preflight

      - name: Approved Host downstream integration gates
        run: >-
          python -m pytest -q
          tests/test_active_config_security_integration.py
          tests/test_approval_execution_integration.py
          tests/test_approved_host_audit_integrity.py
          tests/test_server_operations.py

      - name: Full pytest
        run: python -m pytest -q

      - name: Ruff
        run: >-
          python -m ruff check .
          --exclude .github/diagnose_audit_mirror.py
          --exclude .github/fix_snapshot_only.py

      - name: Compile all
        run: python -m compileall -q src tests

      - name: Diff whitespace check
        shell: bash
        run: git diff --check

      - name: Commit verified source changes
        shell: pwsh
        run: |
          git fetch origin main
          $currentMain = (git rev-parse origin/main).Trim()
          if ($currentMain -ne $env:VALIDATED_MAIN_SHA) {
            throw "main moved during validation: $currentMain"
          }
          git add README.md docs/APPROVED_HOST_RUNTIME.md install-approved-host-runtime.ps1
          git add src/windows_local_mcp/control_plane_guard.py src/windows_local_mcp/process_utils.py src/windows_local_mcp/server.py src/windows_local_mcp/worker.py
          git add tests/test_approved_host_runtime_scope.py tests/test_broker_architecture.py tests/test_powershell_scripts.py tests/test_server_operations.py
          git rm .github/finalize_approved_host_production.py .github/fix_approved_host_guard.py .github/diagnose_audit_mirror.py .github/workflows/diagnose-approved-host.yml
          git diff --cached --check
          git commit -m "Approved Host production境界を完了 [skip ci]"
          git push origin HEAD:fix/approved-host-production-finalize
