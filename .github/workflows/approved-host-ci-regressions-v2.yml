name: Verify Approved Host CI regressions v2

on:
  push:
    branches: [fix/approved-host-ci-regressions-v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approved-host-ci-regressions-v2
  cancel-in-progress: true

jobs:
  verify-and-finalize:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7
        with:
          ref: fix/approved-host-ci-regressions-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply scoped patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/apply_approved_host_ci_regressions_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/apply_approved_host_ci_regressions_v3.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install package and dev checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Verify remaining Approved Host regressions
        run: >-
          python -m pytest -q
          tests/test_approval_execution_integration.py
          -k "snapshot_execution_succeeds_when_bound_workspace_is_unchanged or approved_host_preflight_deadline_is_terminal or approved_host_terminates_descendants_at_runtime_limit"
