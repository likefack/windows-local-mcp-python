name: Verify Approved Host CI regressions v2

on:
  push:
    branches: [fix/approved-host-ci-regressions-v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approved-host-ci-regressions-v2
  cancel-in-progress: true

jobs:
  verify-and-finalize:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7
        with:
          ref: fix/approved-host-ci-regressions-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply scoped patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/apply_approved_host_ci_regressions_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/apply_approved_host_ci_regressions_v3.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install package and dev checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Focused Approved Host regressions
        run: >-
          python -m pytest -q
          tests/test_approval_execution_integration.py
          tests/test_approved_host_audit_integrity.py
          tests/test_broker_architecture.py
          tests/test_runtime_trust.py

      - name: Repeat active-config fail-closed regression
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            python -m pytest -q tests/test_active_config_security_integration.py -k real_approved_host_config_tamper_fails_closed
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Full pytest
        run: python -m pytest -q

      - name: Ruff changed code
        run: >-
          python -m ruff check
          src/windows_local_mcp/runtime_trust.py
          src/windows_local_mcp/control_plane_guard.py
          src/windows_local_mcp/worker.py
          tests/test_active_config_security_integration.py
          tests/test_approval_execution_integration.py
          tests/test_broker_architecture.py
          tests/test_runtime_trust.py

      - name: Compile all
        run: python -m compileall -q src tests

      - name: Finalize target-only commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/apply_approved_host_ci_regressions_v2.py
          git rm .github/apply_approved_host_ci_regressions_v3.py
          git rm .github/diagnose_snapshot_completion_v3.py
          git rm .github/workflows/approved-host-ci-regressions-v2.yml
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows_local_mcp/runtime_trust.py
          git add src/windows_local_mcp/control_plane_guard.py
          git add src/windows_local_mcp/worker.py
          git add tests/test_active_config_security_integration.py
          git add tests/test_approval_execution_integration.py
          git add tests/test_broker_architecture.py
          git add tests/test_runtime_trust.py
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "Approved Host CI回帰を修正 [skip ci]"
          git push origin HEAD:fix/approved-host-ci-regressions-v2
