name: Rebuild Tunnel UX on latest main

on:
  push:
    branches:
      - work/rebuild-tunnel-ux-latest-main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: windows-2025
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v7
        with:
          ref: work/rebuild-tunnel-ux-latest-main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply selective latest-main patch
        shell: pwsh
        run: python .dev-tmp/rebuild_tunnel_ux_latest.py

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('setup-localmcp.ps1', 'secure-mcp-tunnel.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$path parse failed"
            }
          }

      - name: Focused Windows regressions
        shell: pwsh
        run: |
          python -m pytest tests/test_setup_python_diagnostics.py tests/test_tunnel_integration.py tests/test_local_launchers.py tests/test_mcp_stdio_integration.py -q
          python -m ruff check tests/test_tunnel_integration.py

      - name: Commit only final product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .dev-tmp/rebuild_tunnel_ux_latest.py .github/workflows/rebuild-tunnel-ux-latest.yml
          git add setup-localmcp.ps1 secure-mcp-tunnel.ps1 tests/test_tunnel_integration.py
          git commit -m "fix: 最新mainにTunnel設定UX修正を再適用"
          git push origin HEAD:work/rebuild-tunnel-ux-latest-main
