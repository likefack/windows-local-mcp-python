# Context Read Broker example configuration.
# Copy this to a private local file outside workspace_root, data_dir, and sandbox_scratch_dir.
# Select it with LOCAL_MCP_CONTEXT_READ_CONFIG, or place it beside LOCAL_MCP_CONFIG
# as context-read.toml.
#
# Symlink/junction/reparse sidecars are rejected. The active file identity is pinned at startup
# and rechecked before every outbound read; edit/replace it only when you intend to restart WLMCP.

# Disabled by default. When disabled, Context Read tools fail closed.
context_read_enabled = false

# Trusted-operator-selected fixed source. The MCP tools cannot override this URL.
# Decision Deck currently exposes its memory list at /api/v1/memory.
# HTTPS may target any host. Use an ASCII URL; percent-encode non-ASCII path data.
# Loopback HTTP is allowed for local development.
# Non-loopback plain HTTP additionally requires context_read_allow_insecure_http = true.
context_read_endpoint = "http://127.0.0.1:8000/api/v1/memory"

# Optional dedicated read credential. Keep the real token out of the repository.
# context_read_bearer_token = "replace-with-read-only-token"

# Bounded response policy.
context_read_max_response_bytes = 2097152
context_read_max_node_bytes = 524288
context_read_max_nodes = 5000
context_read_timeout_seconds = 10
context_read_allow_insecure_http = false
