# Required. Copy this file to config.toml and set one concrete project directory.
# Run one MCP instance per workspace/profile rather than granting a broad parent directory.
workspace_root = "C:\\path\\to\\your-project"

# Empty uses %LOCALAPPDATA%\WindowsLocalMCP. It must not overlap workspace_root.
data_dir = ""

# Capability switches. false blocks both automatic execution and direct request_host_command use.
filesystem_enabled = true
git_enabled = true
flutter_enabled = false
dart_enabled = false
adb_enabled = false
powershell_enabled = false

# Broad developer commands (Python/pytest/PowerShell/Node/npm/project scripts) use the
# locally approved Codex Windows sandbox route. The adapter invokes only `codex sandbox`;
# it does not start an agent or perform model/API calls. Missing or incompatible backends
# fail closed and never fall back to the Windows user token.
approved_sandbox_enabled = true
approved_sandbox_backend = "codex_cli"
# Optional absolute path to an installed Codex CLI. Empty enables trusted-path discovery.
approved_sandbox_codex_path = ""
# This release intentionally supports only the stronger elevated Windows sandbox and the
# workspace permission profile. Initial Codex sandbox setup may require Administrator/UAC.
approved_sandbox_windows_mode = "elevated"
approved_sandbox_permission_profile = ":workspace"

# ADB is a separate target boundary. The safe default accepts emulator-* serials only.
adb_emulator_only = true
adb_allowed_serials = []

# Child processes receive a small built-in Windows/toolchain allowlist instead of the whole
# parent environment. Add only project-specific variable names that are genuinely required.
# Known injection/redirection variables such as PYTHONPATH, NODE_OPTIONS, GIT_DIR and
# LOCAL_MCP_* are rejected even if listed here.
child_environment_allowlist = []

# Safe Tier network isolation. "appcontainer" is fail-closed and requires the one-time
# setup-network-isolation command. "compatibility" is an explicit legacy mode: it retains
# proxy poisoning/tool protocol restrictions but is NOT an OS network security boundary.
safe_network_isolation_mode = "appcontainer"
safe_network_profile_prefix = "WindowsLocalMCP.SafeTier"

# Machine-local toolchain roots that AppContainer commands must read/execute, for example a
# Flutter SDK or user-local Git installation. Put actual absolute paths only in ignored local
# config/profile files; do not commit private or machine-specific paths.
safe_network_readable_paths = []

# File and artifact limits.
max_text_file_bytes = 2097152
max_write_bytes = 2097152
max_diff_bytes = 4194304
max_backup_bytes = 16777216
max_image_bytes = 10485760
max_output_bytes_per_stream = 16777216
max_data_dir_bytes = 536870912
max_directory_entries = 3000
output_preview_characters = 12000
max_command_arguments = 64
max_command_argument_characters = 1024
max_reason_characters = 4000
max_audit_record_bytes = 131072
retention_days = 14
retention_max_operations = 2000

# Approval requests expire before review; an approved grant has a shorter one-shot TTL.
approval_request_ttl_seconds = 1800
approval_execution_ttl_seconds = 60
approval_manifest_max_files = 10000
approval_manifest_max_bytes = 268435456
default_foreground_timeout_seconds = 30
default_max_runtime_seconds = 1800
default_approver = "local-user"

# Protected file names are denied for direct read and write.
blocked_file_names = [
  ".env",
  ".env.local",
  ".env.production",
  "id_rsa",
  "id_ed25519",
  "credentials.json",
  "service-account.json",
]

# Hidden means omitted from directory listings, not automatically unreadable.
hidden_directories = [
  ".git",
  ".dart_tool",
  "build",
  "node_modules",
  ".venv",
  "__pycache__",
]

# Direct .git access stays denied; Git state is available through git_info/safe Git commands.
read_denied_directories = [".git"]

# Generated/dependency trees are read-compatible but not directly writable by default.
write_denied_directories = [
  ".git",
  ".dart_tool",
  "build",
  "node_modules",
  ".venv",
  "__pycache__",
]

# Streamable HTTP is off by default. When enabled, only loopback hosts are accepted.
http_enabled = false
http_host = "127.0.0.1"
http_port = 8000
# This release deliberately rejects true: authenticated principal ownership is not implemented.
http_multi_principal_enabled = false

# On Windows, remove inherited ACLs and grant the current user and SYSTEM full control.
protect_data_dir_acl = true
